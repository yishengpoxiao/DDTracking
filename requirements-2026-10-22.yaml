# Install PyTorch >=2.4 separately for the intended CPU/CUDA platform.
name: DDTracking
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy>=1.26,<2
      - scipy>=1.11,<1.14
      - nibabel>=5.2,<6
      - dipy==1.9.0
      - h5py>=3.10,<4
      - PyYAML>=6,<7
      - einops>=0.8,<1
      - SimpleITK>=2.3,<3
      - vtk>=9.3,<10
      - tqdm>=4.66,<5
